# Forge mod metadata (MinecraftForge 1.20.1). Version fields are expanded from gradle.properties
# by the generateModMetadata task. The overall format is standard TOML, v0.5.0.

modLoader="javafml"

loaderVersion="${loader_version_range}"

license="${mod_license}"

issueTrackerURL="https://github.com/JuniKnytt/CreateRailGrinding/issues"

[[mods]]

modId="${mod_id}"

version="${mod_version}"

displayName="${mod_name}"

displayURL="github.com/JuniKnytt/CreateRailGrinding"

logoFile="icon.png"

authors="${mod_authors}"
description='''${mod_description}'''

# Declares the mixin config to FML so it gets loaded.
[[mixins]]
config="${mod_id}.mixins.json"

# Dependencies.
[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="create"
    mandatory=true
    versionRange="${create_version_range}"
    ordering="AFTER"
    side="BOTH"
